<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jeito de Mãe Pedidos</title>
<style>
/* Layout: coluna de app mobile (até 430px) com rodapé fixo Início / Pedidos / Perfil; fluxo cardápio > sacola > checkout > Pix > rastreio; visão extra "Painel da loja". */
:root{
  --page:#EFE7E4; --bg:#FFFFFF; --surface:#F7F2F0; --ink:#1B1414; --muted:#6F6360; --line:#E9DFDB;
  --brand:#B01E2D; --brand-ink:#FFFFFF; --brand-text:#B01E2D; --bordo:#5E121C; --terra:#C0603C;
  --ok:#1F7A4D; --ok-bg:#E3F3EA; --off:#8A3A2A; --off-bg:#FBE9E3; --star:#C98A12;
  --map-bg:#EFE9E6; --map-road:#FFFFFF; --map-edge:#E0D6D2; --map-park:#D5E3CC; --map-water:#CFE0EA;
  --font:"Helvetica Now Display","Helvetica Now Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0E0A0A; --bg:#150F0F; --surface:#221A19; --ink:#F4ECE9; --muted:#B3A29E; --line:#352927;
    --brand:#C9303F; --brand-text:#FF7A87; --bordo:#3A0D14; --terra:#E08A66;
    --ok:#5CC08C; --ok-bg:#173626; --off:#F0A08C; --off-bg:#3A1E18; --star:#E2A93A;
    --map-bg:#241C1B; --map-road:#3A2E2C; --map-edge:#2B2221; --map-park:#243226; --map-water:#1F2C36; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0E0A0A; --bg:#150F0F; --surface:#221A19; --ink:#F4ECE9; --muted:#B3A29E; --line:#352927;
  --brand:#C9303F; --brand-text:#FF7A87; --bordo:#3A0D14; --terra:#E08A66;
  --ok:#5CC08C; --ok-bg:#173626; --off:#F0A08C; --off-bg:#3A1E18; --star:#E2A93A;
  --map-bg:#241C1B; --map-road:#3A2E2C; --map-edge:#2B2221; --map-park:#243226; --map-water:#1F2C36; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* barra do protótipo */
.proto{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 16px;background:var(--ink);color:var(--bg);font-size:12px}
.proto small{opacity:.8}
.seg{display:inline-flex;background:rgba(127,127,127,.28);border-radius:8px;padding:2px}
.seg button{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:700;color:inherit;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);opacity:1}

/* app */
.app{max-width:430px;margin:0 auto;background:var(--bg);min-height:100dvh;position:relative;border-inline:1px solid var(--line)}
.addrbar{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);color:var(--brand-text)}
.addrbar span{flex:1;min-width:0;color:var(--ink)}
.addrbar small{display:block;color:var(--muted);font-size:11px}
.addrbar b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addrbar .chev{transform:rotate(90deg);color:var(--muted)}
.banner{height:150px;position:relative;background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px),
  linear-gradient(120deg,var(--bordo),var(--brand));color:#fff;display:flex;align-items:flex-end;padding:12px 16px}
.banner span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero{padding:0 16px 14px;position:relative}
.logo{width:72px;height:72px;border-radius:50%;background:var(--bg);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line);margin-top:-36px;display:grid;place-items:center;font-weight:700;font-size:22px;color:var(--brand-text);letter-spacing:-.02em}
.hero h1{font-size:22px;line-height:1.15;margin:10px 0 2px;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted);align-items:center}
.meta b{color:var(--ink)}
.rate{display:inline-flex;gap:4px;align-items:center;color:var(--ink);font-weight:700}
.rate svg{color:var(--star)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.open{background:var(--ok-bg);color:var(--ok)}
.pill.closed{background:var(--off-bg);color:var(--off)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.closed-note{margin:0 16px 12px;padding:10px 12px;border-radius:10px;background:var(--off-bg);color:var(--off);font-size:13px;font-weight:700}

.tabs{display:flex;border-bottom:1px solid var(--line);padding-inline:8px}
.tabs button{flex:1;padding:12px 6px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--brand-text);border-bottom-color:var(--brand)}
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;padding:7px 14px;border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{margin:12px 16px 0;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:14px}

.sec{padding:18px 16px 4px;scroll-margin-top:60px}
.sec h2{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;width:100%;align-items:flex-start}
.item .txt{flex:1;min-width:0}
.item h3{margin:0 0 3px;font-size:15px}
.item p{margin:0 0 8px;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price s{color:var(--muted);font-weight:400;font-size:13px}
.price .from{font-size:12px;color:var(--muted);font-weight:400}
.off{background:var(--ok-bg);color:var(--ok);font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px}
.item.paused{opacity:.5}
.tag{font-size:11px;font-weight:700;color:var(--off);background:var(--off-bg);padding:2px 6px;border-radius:5px}

.ph{position:relative;border-radius:12px;overflow:hidden;flex:none;display:flex;align-items:flex-end;padding:6px;color:rgba(255,255,255,.85);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.ph::before{content:"";position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28) 0 38%,rgba(255,255,255,.12) 39% 60%,transparent 61%)}
.ph span{position:relative}
.item .ph{width:96px;height:96px}
.t0{background:linear-gradient(135deg,#4A1219,#9A3A2C)}
.t1{background:linear-gradient(135deg,#8C3B1F,#D08A4B)}
.t2{background:linear-gradient(135deg,#6B2A22,#B8523A)}
.t3{background:linear-gradient(135deg,#B4651E,#E2A93A)}
.t4{background:linear-gradient(135deg,#7A1F2C,#C0603C)}

/* rodapé fixo */
.dock{position:sticky;bottom:0;z-index:7;background:var(--bg);border-top:1px solid var(--line)}
.bagbar{padding:10px 16px}
.dock .bagbar+.nav{border-top:1px solid var(--line)}
.dock .bagbar:last-child{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.nav{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--brand-text)}
.nav .dot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid var(--bg)}

.btn{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;background:var(--brand);color:var(--brand-ink);padding:14px 16px;border-radius:12px;font-weight:700;font-size:15px}
.btn.center{justify-content:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:9px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,5,5,.55);z-index:20}
.sheet{position:fixed;z-index:21;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);max-height:92dvh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .cover{height:190px;border-radius:0;padding:12px}
.sheet .cover::before{inset:10% 22%}
.sheet .body{padding:16px}
.sheet h2{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.sheet .desc{color:var(--muted);margin:0 0 10px;font-size:14px}
.close{position:absolute;right:12px;top:12px;z-index:2;width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.grp{margin-top:16px}
.grp h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.grp h4 em{font-style:normal;font-size:11px;font-weight:700;background:var(--surface);color:var(--muted);padding:2px 8px;border-radius:5px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.opt .l{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:20px;height:20px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.mark.r{border-radius:50%}.mark.c{border-radius:5px}
.opt[aria-checked="true"] .mark{border-color:var(--brand);background:var(--brand);color:#fff}
.opt small{color:var(--muted)}
textarea,.field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:15px}
textarea{resize:vertical;min-height:64px}
.sfoot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;flex:none}
.qty button{width:38px;height:40px;display:grid;place-items:center;color:var(--brand-text)}
.qty b{min-width:22px;text-align:center}

/* telas internas */
.top{display:flex;align-items:center;gap:8px;padding:12px 8px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top h1{font-size:17px;margin:0}
.top h1.solo{padding-left:8px;font-size:20px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.iconbtn:hover{background:var(--surface)}
.page{padding:4px 16px 24px}
.page section{padding-top:18px}
.page h2{font-size:15px;margin:0 0 10px;letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700}
.field .err{color:var(--off);font-size:12px;font-weight:700}
.field input.bad{border-color:var(--off)}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.line.total{font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.line.disc{color:var(--ok)}
.lrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block}
.lrow .t small{color:var(--muted);display:block}
.note{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border-radius:12px;padding:14px}
.card.warn{background:var(--off-bg);color:var(--off)}
.row2{display:flex;gap:10px;align-items:flex-end}
.row2 .field{flex:1;min-width:0;margin-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* perfil */
.who{display:flex;gap:14px;align-items:center;padding:20px 16px 16px}
.avatar{width:60px;height:60px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none}
.who h2{margin:0;font-size:19px}
.who .note{margin-top:2px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;text-align:left;border-bottom:1px solid var(--line)}
.mrow .ic{color:var(--muted);display:grid;place-items:center}
.mrow .tx{flex:1;min-width:0}
.mrow .tx b{display:block;font-size:15px}
.mrow .tx small{color:var(--muted);font-size:12px}
.mrow .chev{color:var(--muted)}
.mrow .cnt{background:var(--brand);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px}
.gap{height:10px;background:var(--surface)}
.addr{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.addr .t{flex:1;min-width:0}
.addr .t b{display:block}
.addr .t small{color:var(--muted);display:block}
.linkbtn{color:var(--brand-text);font-weight:700;font-size:13px}
.linkbtn.danger{color:var(--off)}
details{border-bottom:1px solid var(--line);padding:14px 0}
details summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--muted);font-size:18px;line-height:1}
details[open] summary::after{content:"\2212"}
details p{margin:8px 0 0;color:var(--muted);font-size:14px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.trow small{display:block;color:var(--muted)}

/* mapa */
.map{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line)}
.code4{font-size:30px;font-weight:700;letter-spacing:.3em;text-align:center;padding:6px 0 2px}
.eta{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stars{display:flex;gap:6px}
.stars button{color:var(--line)}
.stars button.on{color:var(--star)}

.qrwrap{display:grid;place-items:center;padding:18px 0}
.qrwrap svg{width:220px;height:220px;border-radius:12px;border:1px solid var(--line)}
.code{word-break:break-all;font-size:12px;background:var(--surface);padding:10px 12px;border-radius:10px;color:var(--muted)}

.steps{list-style:none;margin:6px 0 0;padding:0}
.steps li{display:flex;gap:14px;position:relative;padding-bottom:22px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;background:var(--bg);z-index:1}
.steps li.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.steps li.now .dot{border-color:var(--brand)}
.steps li.now .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.steps li.done::before{background:var(--brand)}
.steps b{display:block}
.steps small{color:var(--muted)}
.steps li:not(.done):not(.now) b{color:var(--muted)}

.review{padding:14px 0;border-bottom:1px solid var(--line)}
.review .h{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:2px}
.review .st{display:flex;gap:1px;color:var(--star);margin-bottom:4px}
.review p{margin:0;color:var(--muted);font-size:14px}
.score{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.score big{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1}

/* pedidos */
.ocard{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-top:12px}
.ocard .h{display:flex;gap:12px;align-items:center}
.ocard .mini{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;color:var(--brand-text);flex:none}
.ocard .h .t{flex:1;min-width:0}
.ocard .h .t b{display:block}
.ocard .h .t small{color:var(--muted)}
.ocard .its{color:var(--muted);font-size:13px}
.ocard .acts{display:flex;gap:8px}
.ocard .acts .btn{flex:1;justify-content:center}

/* painel */
.admin{max-width:820px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px}
.admin h1{margin:0;font-size:22px;letter-spacing:-.01em}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{margin:0 0 12px;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.order{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.order.new{border-color:var(--brand)}
.order .top2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface);color:var(--ink)}
.badge.b0{background:var(--off-bg);color:var(--off)}
.badge.b3{background:var(--ok-bg);color:var(--ok)}
.empty{color:var(--muted);padding:8px 0}
.ptable{display:grid;gap:0}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.prow .n{min-width:0}
.pin{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:0 8px}
.pin input{width:76px;border:0;background:none;padding:8px 0;text-align:right;font-variant-numeric:tabular-nums}
.pin input:focus-visible{outline:none}
.pin:focus-within{outline:2px solid var(--brand-text)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (max-width:480px){.prow{grid-template-columns:1fr auto}.prow .sw{grid-column:2}}
</style>

<div id="root"></div>

<script>
(function(){
var money=function(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var FEE=5;

function svg(p,s){return '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
var ic={
 back:svg('<path d="M15 5l-7 7 7 7"/>'),
 x:svg('<path d="M6 6l12 12M18 6L6 18"/>',18),

/* ---------- mapa ilustrativo ---------- */
var ROUTE=[[110,210],[110,160],[250,160],[250,100]];
function pointAt(p){
 var segs=[],tot=0,i;
 for(i=0;i<ROUTE.length-1;i++){var d=Math.abs(ROUTE[i+1][0]-ROUTE[i][0])+Math.abs(ROUTE[i+1][1]-ROUTE[i][1]);segs.push(d);tot+=d}
 var t=p*tot;
 for(i=0;i<segs.length;i++){
  if(t<=segs[i]||i===segs.length-1){var f=segs[i]?Math.min(1,t/segs[i]):1;return [ROUTE[i][0]+(ROUTE[i+1][0]-ROUTE[i][0])*f,ROUTE[i][1]+(ROUTE[i+1][1]-ROUTE[i][1])*f]}
  t-=segs[i]
 }
 return ROUTE[ROUTE.length-1]
}

 g+='<path d="M0 228C60 205 120 236 200 226S330 218 360 236V240H0z" fill="var(--map-water)"/>';
 for(k=0;k<V.length;k++)g+='<line x1="'+V[k]+'" y1="0" x2="'+V[k]+'" y2="240" stroke="var(--map-edge)" stroke-width="12"/>';
 for(k=0;k<Hs.length;k++)g+='<line x1="0" y1="'+Hs[k]+'" x2="360" y2="'+Hs[k]+'" stroke="var(--map-edge)" stroke-width="12"/>';
 for(k=0;k<V.length;k++)g+='<line x1="'+V[k]+'" y1="0" x2="'+V[k]+'" y2="240" stroke="var(--map-road)" stroke-width="9"/>';
 for(k=0;k<Hs.length;k++)g+='<line x1="0" y1="'+Hs[k]+'" x2="360" y2="'+Hs[k]+'" stroke="var(--map-road)" stroke-width="9"/>';
 g+='<text x="124" y="156" font-size="9" fill="var(--muted)">Av. Central</text>';
 if(o.area)g+='<circle cx="110" cy="210" r="190" fill="var(--brand)" fill-opacity=".07" stroke="var(--brand)" stroke-opacity=".6" stroke-dasharray="6 5" stroke-width="1.5"/>';
 if(o.route)g+='<path d="M110 210L110 160L250 160L250 100" fill="none" stroke="var(--brand)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>';
 g+=pinSVG(110,210,'var(--brand)');
 if(o.cust==='out')g+=pinSVG(340,24,'var(--ink)');else if(o.cust)g+=pinSVG(250,100,'var(--ink)');

 return '<svg class="map" viewBox="0 0 360 240" role="img" aria-label="Mapa ilustrativo da entrega">'+g+'</svg>'
}

function qr(){
 var n=25,s=7,out='';
 function r(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}
 function fin(x,y){return (x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9)}
 for(var y=0;y<n;y++)for(var x=0;x<n;x++){if(fin(x,y))continue;if(r()>.52)out+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
 [[0,0],[n-7,0],[0,n-7]].forEach(function(p){out+='<rect x="'+p[0]+'" y="'+p[1]+'" width="7" height="7"/><rect x="'+(p[0]+1)+'" y="'+(p[1]+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(p[0]+2)+'" y="'+(p[1]+2)+'" width="3" height="3"/>'});
 return '<svg viewBox="-1 -1 27 27" role="img" aria-label="QR Code Pix de exemplo"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/><g fill="#111">'+out+'</g></svg>'
}

 var o=S.mine;

 '<section><h2>Pix copia e cola</h2><div class="code" id="pixcode">00020126EXEMPLO0014BR.GOV.BCB.PIX-JEITO-DE-MAE-'+o.id+'</div></section>'+

}
function prog(o){return o.status>=3?1:o.status===2?Math.min(1,(Date.now()-(o.leftAt||Date.now()))/60000):0}

 if(o.status===0)return o.delivery?'30–45 min':'Em breve';

}

/* ---------- render ---------- */
var root=document.getElementById('root'),tick=null;
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function upd(){
 var o=S.mine;if(!o)return;
 var c=document.getElementById('courier');if(c){var pt=pointAt(prog(o));c.setAttribute('transform','translate('+pt[0]+','+pt[1]+')')}
 var e=document.getElementById('eta');if(e)e.textContent=etaText(o)
}
function startTick(){
 stopTick();var o=S.mine;
 if(S.mode==='cliente'&&S.view==='track'&&o&&o.delivery&&o.status===2){if(!o.leftAt)o.leftAt=Date.now();upd();tick=setInterval(upd,1000)}
}
function render(){
 var y=window.scrollY,body;
 if(S.mode==='painel')body=adminHTML();
 else{
  var v=S.view==='menu'?menuHTML():S.view==='orders'?ordersHTML():S.view==='profile'?profileHTML():S.view==='sub'?subHTML():S.view==='addAddr'?addAddrHTML():S.view==='checkout'?checkoutHTML():S.view==='pix'?pixHTML():trackHTML();
  body='<div class="app">'+v+dockHTML()+'</div>'
 }
 root.innerHTML='<div class="proto"><div><b>Protótipo</b> <small>fotos, logo, mapa e valores são exemplos</small></div><div class="seg" role="group" aria-label="Visão">'+
  '<button aria-pressed="'+(S.mode==='cliente')+'" data-act="mode" data-v="cliente">Cliente</button><button aria-pressed="'+(S.mode==='painel')+'" data-act="mode" data-v="painel">Painel da loja</button></div></div>'+
  body+(S.mode==='cliente'?sheetHTML():'')+(S.toast?'<div class="toast" role="status">'+S.toast+'</div>':'');
 document.body.style.overflow=(S.sheet&&S.mode==='cliente')?'hidden':'';
 window.scrollTo(0,y);
 startTick()
}
function toast(t){S.toast=t;render();setTimeout(function(){S.toast='';render()},1800)}
function openItem(id){var i=byId(id);S.sheet={type:'item',item:i,size:i.sizes?i.sizes[i.sizes.length-1]:null,extras:[],qty:1,note:''}}
function go(view,sub){S.view=view;S.sub=sub||null;S.sheet=null;window.scrollTo(0,0)}
function newForm(){return {cep:'',found:null,num:'',comp:'',ref:'',label:'Casa',err:'',numErr:false}}
function searchCep(){
 var f=S.addrForm,d=f.cep.replace(/\D/g,'');f.err='';f.found=null;
 if(d.length!==8){f.err='Digite os 8 números do CEP.';return}
 var r=CEPS[d];
 if(!r){f.err='CEP não encontrado neste protótipo. Use um dos CEPs de exemplo abaixo.';return}
 f.found=r
}

document.addEventListener('click',function(ev){
 var t=ev.target.closest('[data-act]');if(!t||t.tagName==='INPUT')return;
 var a=t.getAttribute('data-act'),v=t.getAttribute('data-v');
 if(a==='mode'){S.mode=v;S.sheet=null;window.scrollTo(0,0)}
 else if(a==='nav'){go(v)}
 else if(a==='sub'){go('sub',v)}
 else if(a==='backProfile'){go('profile')}
 else if(a==='backOrders'){go('orders')}
 else if(a==='tab'){S.tab=v}
 else if(a==='cat'){S.cat=v;render();var idx=MENU.map(function(c){return c.cat}).indexOf(v);var el=document.getElementById('cat'+idx);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
 else if(a==='openItem'){if(!S.open){toast('Estamos fechados no momento');return}openItem(v)}
 else if(a==='closeSheet'){S.sheet=null}
 else if(a==='size'){S.sheet.size=S.sheet.item.sizes[+v]}
 else if(a==='extra'){var e=S.sheet.item.extras[+v],p=S.sheet.extras.indexOf(e);if(p>-1)S.sheet.extras.splice(p,1);else S.sheet.extras.push(e)}
 else if(a==='sq'){S.sheet.qty=Math.max(1,S.sheet.qty+(+v))}
 else if(a==='addBag'){var s=S.sheet;S.cart.push({item:s.item,size:s.size,extras:s.extras.slice(),note:s.note.trim(),qty:s.qty});S.sheet=null}
 else if(a==='openBag'){S.sheet={type:'bag'}}
 else if(a==='lq'){var l=S.cart[+t.getAttribute('data-i')];l.qty+=(+v);if(l.qty<1)S.cart.splice(+t.getAttribute('data-i'),1);if(!S.cart.length)S.sheet=null}
 else if(a==='toCheckout'){go('checkout');S.errors={}}
 else if(a==='backMenu'){go('menu')}
 else if(a==='deliv'){S.form.delivery=v==='1'}
 else if(a==='pay'){S.form.pay=v}
 else if(a==='openAddrSheet'){S.sheet={type:'addr'}}
 else if(a==='pickAddr'){S.addrSel=+v;S.sheet=null}
 else if(a==='pickAddrPage'){S.addrSel=+v}
 else if(a==='newAddr'){S.addrBack={view:S.view,sub:S.sub};S.addrForm=newForm();go('addAddr')}
 else if(a==='backAddr'){var b=S.addrBack||{view:'menu'};go(b.view,b.sub)}
 else if(a==='cepSearch'){searchCep()}
 else if(a==='cepEx'){S.addrForm.cep=fmtCep(v);searchCep()}
 else if(a==='label'){S.addrForm.label=v}
 else if(a==='saveAddr'){
  var f=S.addrForm;f.numErr=false;
  if(!f.found||f.found.out)return;
  if(!f.num.trim()){f.numErr=true;render();return}
  var id=Math.max.apply(null,S.addresses.map(function(x){return x.id}).concat([0]))+1;
  S.addresses.push({id:id,label:f.label,cep:f.cep.replace(/\D/g,''),street:f.found.street,num:f.num.trim(),comp:f.comp.trim(),bairro:f.found.bairro,city:f.found.city,uf:f.found.uf,ref:f.ref.trim()});
  S.addrSel=id;var bk=S.addrBack||{view:'menu'};go(bk.view,bk.sub);toast('Endereço salvo');return
 }
 else if(a==='delAddr'){S.addresses=S.addresses.filter(function(x){return x.id!==+v});if(!curAddr()&&S.addresses.length)S.addrSel=S.addresses[0].id}
 else if(a==='applyCoupon'){var k=S.couponInput.trim().toUpperCase();if(COUPONS[k]){S.coupon=k;S.couponErr='';S.couponInput=''}else S.couponErr='Cupom inválido ou expirado.'}
 else if(a==='rmCoupon'){S.coupon=null}
 else if(a==='useCoupon'){S.coupon=v;toast('Cupom '+v+' será aplicado no próximo pedido');return}
 else if(a==='ntf'){S.notif[v]=!S.notif[v]}
 else if(a==='logout'){toast('Você saiu da conta (exemplo)');return}
 else if(a==='delAccount'){toast('Pedido de exclusão registrado (exemplo)');return}
 else if(a==='place'){
  var fm=S.form,er={},u=S.user;
  if(u.name.trim().length<3)er.name='Informe seu nome completo.';
  if(u.phone.replace(/\D/g,'').length<10)er.phone='Informe o telefone com DDD.';
  if(fm.delivery&&!curAddr())er.addr='Escolha ou adicione um endereço de entrega.';
  S.errors=er;
  if(Object.keys(er).length){render();return}
  var payTxt=fm.pay==='pix'?'Pix aguardando pagamento':fm.pay==='card'?'Cartão na entrega':'Dinheiro na entrega'+(fm.change.trim()?' (troco para R$ '+esc(fm.change.trim())+')':'');
  var nid=Math.max.apply(null,S.orders.map(function(x){return x.id}))+1;
  var o={id:nid,mine:true,date:'Hoje',name:u.name.trim(),lines:S.cart.slice(),items:itemsStr(S.cart),total:total(),pay:payTxt,status:0,delivery:fm.delivery,addr:fm.delivery?curAddr():null,code:String(1000+Math.floor(Math.random()*9000)),rating:0};
  S.orders.push(o);S.mine=o;S.cart=[];S.coupon=null;go(fm.pay==='pix'?'pix':'track')
 }
 else if(a==='copy'){var c=document.getElementById('pixcode');try{navigator.clipboard.writeText(c.textContent).then(function(){toast('Código copiado')},function(){toast('Selecione o código e copie')})}catch(x){toast('Selecione o código e copie')}return}
 else if(a==='paid'){S.mine.pay='Pix pago';go('track')}
 else if(a==='openTrack'){S.mine=S.orders.filter(function(x){return x.id===+v})[0];go('track')}
 else if(a==='reorder'){var src=S.orders.filter(function(x){return x.id===+v})[0];S.cart=src.lines.filter(function(l){return !l.item.paused}).map(function(l){return {item:l.item,size:l.size,extras:l.extras.slice(),note:'',qty:l.qty}});go('menu');S.sheet={type:'bag'}}
 else if(a==='rate'){S.mine.rating=+v}
 else if(a==='newOrder'){S.tab='cardapio';go('menu')}
 else if(a==='toggleOpen'){S.open=!S.open}
 else if(a==='advance'){var od=S.orders.filter(function(x){return x.id===+v})[0];if(od.status<3){od.status++;if(od.status===2)od.leftAt=Date.now()}}
 else if(a==='pause'){var it=byId(v);it.paused=!it.paused}
 render()
});
document.addEventListener('input',function(ev){
 var t=ev.target,k=t.getAttribute('data-f');if(!k)return;
 if(k==='note'&&S.sheet)S.sheet.note=t.value;
 else if(k.indexOf('u.')===0)S.user[k.slice(2)]=t.value;
 else if(k.indexOf('a.')===0){var kk=k.slice(2);if(kk==='cep')t.value=fmtCep(t.value);S.addrForm[kk]=t.value}
 else if(k==='coupon')S.couponInput=t.value;
 else if(k==='change')S.form.change=t.value
});
document.addEventListener('change',function(ev){
 var t=ev.target;if(t.getAttribute('data-act')!=='price')return;
 var i=byId(t.getAttribute('data-id')),r=i.sizes?i.sizes[+t.getAttribute('data-r')]:i;
 var n=parseFloat(t.value.replace(/\./g,'').replace(',','.'));
 if(!isNaN(n)&&n>0){r.price=Math.round(n*100)/100;if(r.from&&r.from<=r.price)r.from=null}
 render()
});
render();
})();
</script>

</body></html>
